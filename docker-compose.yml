services:
  postgres:
    image: postgres:17-alpine
    container_name: rc-combat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rc_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-rc_combat}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - rc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rc}"]
      interval: 3s
      retries: 20
volumes:
  rc_pgdata:
